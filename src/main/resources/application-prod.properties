# Deployment: PostgreSQL from environment variables, no demo data, quieter logs.

# No defaults on purpose: a missing variable fails startup instead of falling back silently.
main.datasource.url=${DB_URL}
main.datasource.username=${DB_USER}
main.datasource.password=${DB_PASSWORD}

# Uploaded files (floor plans). The container mounts a volume here.
jmix.localfs.storage-dir=${FILE_STORAGE_DIR:/app/filestorage}

spring.output.ansi.enabled=never

logging.level.root=info
logging.level.io.jmix=warn
logging.level.eclipselink.logging.sql=warn
logging.level.io.jmix.core.datastore=warn
logging.level.io.jmix.core.AccessLogger=info
logging.level.org.springframework.security=warn
logging.level.org.atmosphere=warn
